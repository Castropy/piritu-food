<div class="flex h-screen bg-gray-50">
  <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
    <div class="p-6">
      <h1 class="text-2xl font-bold text-orange-600 italic">PírituFood</h1>
      <p class="text-xs text-gray-400 font-medium uppercase tracking-wider">Panel de Aliado</p>
    </div>

    <nav class="flex-1 px-4 space-y-2">
      <a *ngFor="let item of menuItems"
         [routerLink]="item.route"
         routerLinkActive="bg-orange-50 text-orange-600 border-r-4 border-orange-600 shadow-sm"
         class="flex items-center gap-3 px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-100 transition-all group">
        <i [class]="item.icon" class="text-lg transition-transform group-hover:scale-110"></i>
        <span class="font-semibold">{{ item.label }}</span>
      </a>
    </nav>

    <div class="p-4 border-t border-gray-100">
      <button class="flex items-center gap-3 px-4 py-3 text-red-500 w-full hover:bg-red-50 rounded-xl transition-all font-bold">
        <i class="pi pi-sign-out"></i>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col overflow-hidden">
    
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm z-10">
      <div class="flex flex-col">
        <h2 class="font-bold text-gray-800">Panel de Control</h2>
        <span class="text-xs text-green-500 flex items-center gap-1">
          <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
          Sistema Operativo
        </span>
      </div>
      
      <div class="flex items-center gap-4">
        <div class="flex flex-col items-end mr-2">
          <span class="text-sm font-bold text-gray-700">Aliado Píritu</span>
          <span class="text-[10px] text-gray-400">Admin Mode</span>
        </div>
        <div class="w-10 h-10 bg-orange-100 rounded-full flex items-center justify-center text-orange-600 shadow-inner">
          <i class="pi pi-user text-lg"></i>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6 md:p-8">
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
        
      </div>
    </main>

  </div>
</div>
